name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Check google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Download it from Firebase console and upload it to the app/ folder."
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LearnEnglishSimply.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LearnEnglishSimply-apk
          path: LearnEnglishSimply.apk

      - name: Publish release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Learn English Simply v${{ github.run_number }}
          files: LearnEnglishSimply.apk
