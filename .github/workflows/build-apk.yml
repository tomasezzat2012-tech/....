name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Unpack project from ZIP
        run: |
          unzip -q LearnEnglishSimply-Android-Source-Firebase.zip -d project
          GS=$(find . -path ./project -prune -o -iname 'google-services*' -type f -print | head -1)
          echo "Found: $GS"
          if [ -z "$GS" ]; then
            echo "::error::No google-services file found."
            exit 1
          fi
          cp "$GS" project/app/google-services.json
          if [ -f AppConfig.kt ]; then
            cp AppConfig.kt project/app/src/main/kotlin/com/learnenglishsimply/app/AppConfig.kt
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '
